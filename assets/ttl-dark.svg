<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-labelledby="t">
<title id="t">The one-hour cliff: share of Claude Code calls that re-wrote the whole cached history, by idle gap. 0–2 min 1%, 2–5 min 4%, 5–10 min 7%, 10–20 min 7%, 20–30 min 13%, 30–45 min 17%, 45–60 min 20%, 60–90 min 97%, 90–180 min 97%, &gt;180 min 93%.</title>
<style>
