@keyframes grow{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(.2,.7,.2,1)}9%{transform:scaleY(1)}92%{transform:scaleY(1);opacity:1}97%{transform:scaleY(1);opacity:0}100%{transform:scaleY(0);opacity:0}}@keyframes growc{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(.3,1.5,.55,1)}9%{transform:scaleY(1)}92%{transform:scaleY(1);opacity:1}97%{transform:scaleY(1);opacity:0}100%{transform:scaleY(0);opacity:0}}.bar{animation:grow 14s infinite backwards}.barc{animation:growc 14s infinite backwards}
@keyframes lab{0%,8%{opacity:0}12%,92%{opacity:1}97%,100%{opacity:0}}.lab{animation:lab 14s linear infinite backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
